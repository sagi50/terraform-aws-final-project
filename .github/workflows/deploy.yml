name: Voting App Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - ".github/workflows/**"

  push:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without state backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate configuration
        run: terraform validate -no-color

  build:
    name: Build ${{ matrix.service }}
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]

    env:
      AWS_REGION: eu-north-1
      REPOSITORY: ${{ vars.NAME_PREFIX }}-${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find ECR repository
        id: repository
        shell: bash
        run: |
          url=$(aws ecr describe-repositories \
            --repository-names "$REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check whether image already exists
        id: existing
        if: github.event_name == 'push'
        shell: bash
        run: |
          count=$(aws ecr list-images \
            --repository-name "$REPOSITORY" \
            --filter tagStatus=TAGGED \
            --query "length(imageIds[?imageTag=='${IMAGE_TAG}'])" \
            --output text)
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ECR
        if: github.event_name == 'push' && steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.repository.outputs.url }}:${{ github.sha }}

  plan:
    name: Plan ${{ matrix.environment }}
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Initialize environment state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TARGET_ENV: ${{ matrix.environment }}
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=voting-app/$TARGET_ENV/terraform.tfstate" \
            -backend-config="region=eu-north-1" \
            -backend-config="use_lockfile=true"

      - name: Plan environment
        env:
          TARGET_ENV: ${{ matrix.environment }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          terraform plan -input=false -no-color \
            -var-file="envs/$TARGET_ENV.tfvars" \
            -var="name_prefix=$NAME_PREFIX" \
            -var="image_tag=$IMAGE_TAG"

  deploy-dev:
    name: Deploy dev
    if: github.event_name == 'push'
    needs: build

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      image_tag: ${{ github.sha }}

  deploy-prod:
    name: Deploy prod
    if: github.event_name == 'push'
    needs: deploy-dev

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      image_tag: ${{ github.sha }}
